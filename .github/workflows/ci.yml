name: release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-windows
    runs-on: windows-2022
    if: ${{ !startsWith(github.ref, 'refs/tags/light-v') && !startsWith(github.ref, 'refs/tags/license-attach') }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          submodules: recursive

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '6.0.x'

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: NuGet Restore
      run: |
        cd ${{ github.workspace }}
        nuget restore RoundedTB.sln

    - name: Build
      run: |
        cd ${{ github.workspace }}
        msbuild "-property:Configuration=Release" -t:RoundedTB

    - name: Publish self-contained
      run: |
        cd ${{ github.workspace }}
        msbuild RoundedTB\RoundedTB.csproj -restore -property:Configuration=Release -property:RuntimeIdentifier=win-x64 -property:SelfContained=true -property:PublishDir=${{ github.workspace }}/dist/win-x64/ -t:Publish

    - name: Publish framework-dependent
      run: |
        cd ${{ github.workspace }}
        msbuild RoundedTB\RoundedTB.csproj -restore -property:Configuration=Release -property:RuntimeIdentifier=win-x64 -property:SelfContained=false -property:PublishDir=${{ github.workspace }}/dist/framework/ -t:Publish

    - name: Trim satellite languages
      run: |
        $roots = @(
          "${{ github.workspace }}\dist\win-x64",
          "${{ github.workspace }}\dist\framework",
          (Get-ChildItem "${{ github.workspace }}\RoundedTB\bin" -Directory -Filter 'RoundedTB-*' | Select-Object -ExpandProperty FullName)
        )
        foreach ($root in $roots) {
          $cultures = Get-ChildItem $root -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^[a-z]{2}(-[A-Za-z]{2,4})?$' -and $_.Name -ne 'en' }
          foreach ($culture in $cultures) {
            Remove-Item $culture.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }
        }

    - name: Trim unused WinForms assemblies
      run: |
        $roots = @(
          "${{ github.workspace }}\dist\win-x64",
          "${{ github.workspace }}\dist\framework",
          (Get-ChildItem "${{ github.workspace }}\RoundedTB\bin" -Directory -Filter 'RoundedTB-*' | Select-Object -ExpandProperty FullName)
        )
        $winforms = @(
          'System.Windows.Forms.dll',
          'System.Windows.Forms.Design.dll',
          'System.Windows.Forms.Design.Editors.dll',
          'System.Windows.Forms.Primitives.dll',
          'Microsoft.VisualBasic.Forms.dll',
          'WindowsFormsIntegration.dll'
        )
        foreach ($root in $roots) {
          foreach ($name in $winforms) {
            Get-ChildItem $root -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
        }

    - name: Trim framework-dependent debug files
      run: |
        Get-ChildItem "${{ github.workspace }}\dist\framework" -Recurse -Include *.pdb,*.xml -File -ErrorAction SilentlyContinue |
          Remove-Item -Force -ErrorAction SilentlyContinue

    - name: Upload framework-dependent artifact
      uses: actions/upload-artifact@v7
      with:
        name: RoundedTB-win-x64-framework-dependent
        path: |
          .\dist\framework\

    - name: Upload self-contained build
      uses: actions/upload-artifact@v7
      with:
        name: RoundedTB-win-x64-self-contained
        path: |
          .\dist\win-x64\

    - name: Package release
      if: startsWith(github.ref, 'refs/tags/v1.0')
      run: |
        Compress-Archive -Path .\dist\win-x64\* -DestinationPath .\RoundedTB-win-x64-self-contained.zip -Force

    - name: Package framework-dependent release
      if: startsWith(github.ref, 'refs/tags/v1.0')
      run: |
        Compress-Archive -Path .\dist\framework\* -DestinationPath .\RoundedTB-win-x64-framework-dependent.zip -Force

    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/v1.0')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" ".\RoundedTB-win-x64-self-contained.zip" ".\RoundedTB-win-x64-framework-dependent.zip" --title "RoundedTB ${{ github.ref_name }}" --generate-notes

  light:
    name: light-host-release
    runs-on: windows-2022
    if: ${{ startsWith(github.ref, 'refs/tags/light-v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'branch') }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '9.0.x'

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Publish unified single-EXE app (and run self-tests)
      shell: pwsh
      run: |
        & "${{ github.workspace }}\RoundedTB.Host\build-host.ps1" -OutputDir "${{ github.workspace }}\dist\light-publish" -RunSelfTests

    - name: Stage and verify the single-EXE release asset
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $publish = "${{ github.workspace }}\dist\light-publish"
        $exe = Join-Path $publish 'RoundedTBHost.exe'
        if (-not (Test-Path $exe)) { throw 'Published RoundedTBHost.exe was not found.' }
        $otherExecutables = @(Get-ChildItem $publish -Filter '*.exe' -File | Where-Object { $_.FullName -ne $exe })
        if ($otherExecutables.Count -gt 0) { throw "Unexpected additional executable(s): $($otherExecutables.Name -join ', ')" }

        $target = "${{ github.workspace }}\RoundedTBHost.exe"
        Copy-Item $exe $target -Force
        $hash = (Get-FileHash $target -Algorithm SHA256).Hash
        Set-Content "$target.sha256" "$hash  RoundedTBHost.exe" -Encoding ascii
        Write-Host "Release asset RoundedTBHost.exe SHA256 $hash"

    - name: Upload light release artifact
      uses: actions/upload-artifact@v7
      with:
        name: RoundedTBHost-light
        path: |
          .\RoundedTBHost.exe
          .\RoundedTBHost.exe.sha256

    - name: Create lightweight host release
      if: ${{ startsWith(github.ref, 'refs/tags/light-v') }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = "${{ github.ref_name }}" -replace '^light-v', ''
        gh release create "${{ github.ref_name }}" "${{ github.workspace }}\RoundedTBHost.exe" "${{ github.workspace }}\RoundedTBHost.exe.sha256" "${{ github.workspace }}\LICENSE" "${{ github.workspace }}\RoundedTB.Host\THIRD-PARTY-NOTICES.txt" --title "RoundedTB Light v$version" --latest=false --notes-file "${{ github.workspace }}\RoundedTB.Host\RELEASE-NOTES.md"
