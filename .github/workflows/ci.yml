name: release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-windows
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          submodules: recursive

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '6.0.x'

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: NuGet Restore
      run: |
        cd ${{ github.workspace }}
        nuget restore RoundedTB.sln

    - name: Build
      run: |
        cd ${{ github.workspace }}
        msbuild "-property:Configuration=Release" -t:RoundedTB

    - name: Publish self-contained
      run: |
        cd ${{ github.workspace }}
        msbuild RoundedTB\RoundedTB.csproj -restore -property:Configuration=Release -property:RuntimeIdentifier=win-x64 -property:SelfContained=true -property:PublishDir=${{ github.workspace }}/dist/win-x64/ -t:Publish

    - name: Add commit hash to output folder
      run: |
        Rename-Item -Path ".\RoundedTB\bin\Release" -NewName "RoundedTB-$(git rev-parse --short ${{ github.sha }})"

    - name: Trim satellite languages
      run: |
        $roots = @(
          "${{ github.workspace }}\dist\win-x64",
          (Get-ChildItem "${{ github.workspace }}\RoundedTB\bin" -Directory -Filter 'RoundedTB-*' | Select-Object -ExpandProperty FullName)
        )
        foreach ($root in $roots) {
          $cultures = Get-ChildItem $root -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^[a-z]{2}(-[A-Za-z]{2,4})?$' -and $_.Name -ne 'en' }
          foreach ($culture in $cultures) {
            Remove-Item $culture.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }
        }

    - name: Trim unused WinForms assemblies
      run: |
        $roots = @(
          "${{ github.workspace }}\dist\win-x64",
          (Get-ChildItem "${{ github.workspace }}\RoundedTB\bin" -Directory -Filter 'RoundedTB-*' | Select-Object -ExpandProperty FullName)
        )
        $winforms = @(
          'System.Windows.Forms.dll',
          'System.Windows.Forms.Design.dll',
          'System.Windows.Forms.Design.Editors.dll',
          'System.Windows.Forms.Primitives.dll',
          'Microsoft.VisualBasic.Forms.dll',
          'WindowsFormsIntegration.dll'
        )
        foreach ($root in $roots) {
          foreach ($name in $winforms) {
            Get-ChildItem $root -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
        }

    - name: Upload framework-dependent build
      uses: actions/upload-artifact@v7
      with:
        name: rtb-artifacts
        path: |
          .\RoundedTB\bin\RoundedTB-*\

    - name: Upload self-contained build
      uses: actions/upload-artifact@v7
      with:
        name: rtb-selfcontained
        path: |
          .\dist\win-x64\

    - name: Package release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        Compress-Archive -Path .\dist\win-x64\* -DestinationPath .\RoundedTB-win-x64.zip -Force

    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" ".\RoundedTB-win-x64.zip" --title "RoundedTB ${{ github.ref_name }}" --generate-notes
